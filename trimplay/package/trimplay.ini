# TrimPlay settings. Edit on a PC, or over SSH/SFTP.

# Your PSN account ID, base64 (12 characters ending in "="). Only needed once,
# to pair. See README.md "Getting your account ID".
psn_account_id=

# Console IP. Leave empty to find it automatically. Set it if the console
# never shows up (some routers block broadcast between Wi-Fi clients).
host=

# Stream quality. A regular PS4 sends up to 720p; a PS4 Pro can do 1080p, but
# the Smart Pro screen is 1280x720 anyway. 720p/30 is the safe start; try
# fps=60 and check the stats overlay (MENU+L1) to see if decoding keeps up.
resolution=720
fps=30
# kbps, 0 = the console's default for the resolution
bitrate=0

# Decoding (software, on the four Cortex-A53 cores).
decode_threads=4
# Frame threads decode faster but add ~2 frames of lag. Try if fps is low.
decode_frame_threads=0
# Skips the deblocking filter: big speed-up, slightly blockier picture.
fast_decode=0

# Drop queued audio past this, to stay in sync over Wi-Fi.
audio_latency_ms=120
stick_deadzone=2500
# Face buttons map by position (bottom = Cross, right = Circle). Set to 1 to swap.
swap_ab=0
show_stats=0
verbose_log=0

# Only needed if the Button test screen (START on the console list) shows
# buttons that don't light up. Put the raw number it shows after "=".
# Names: south east west north up down left right l1 r1 l2 r2 l3 r3 select start menu
[joystick]
# south=0

[keys]
# menu=41
