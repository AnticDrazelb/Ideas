name: TrimPlay (TrimUI Smart Pro build)

on:
  workflow_dispatch:
  push:
    paths:
      - 'trimplay/**'
      - '.github/workflows/trimplay.yml'

jobs:
  build:
    # Native arm64 runner (free for public repos): no emulation, so it builds
    # in minutes. For a private repo without arm runners, use ubuntu-latest
    # and add a docker/setup-qemu-action@v3 step (slow, but works).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sh trimplay/build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TrimPlay
          path: trimplay/dist/TrimPlay.zip
